name: KJH Docker Test

on:
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Test Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.KJH_DOCKER_USERNAME }}
          password: ${{ secrets.KJH_DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend test image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.KJH_DOCKER_USERNAME }}/rookie-playbook-backend:test

      - name: Build and push frontend test image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.KJH_DOCKER_USERNAME }}/rookie-playbook-frontend:test