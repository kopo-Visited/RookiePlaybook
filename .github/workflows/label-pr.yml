name: Label PR by branch

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  issues: write
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;
            const author = pr.user.login;
            const allMembers = ['Kim-buyeon', 'jeongyoni', 'JJeong-Hyeon', 'adieud99'];

            // 라벨
            let label = '';
            if (branch.startsWith('feat/fe')) label = 'frontend';
            else if (branch.startsWith('feat/be')) label = 'backend';
            else if (branch.startsWith('fix/')) label = 'bugfix';
            else if (branch.startsWith('chore/')) label = 'chore';
            if (label) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [label]
              });
            }

            // Assignee — PR 작성자
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              assignees: [author]
            });

            // Reviewers — 작성자 제외 나머지
            if (context.payload.action === 'opened') {
              const reviewers = allMembers.filter(m => m !== author);
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                reviewers
              });
            }
