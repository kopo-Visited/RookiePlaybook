name: Label PR by branch

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            let label = '';
            if (branch.startsWith('feat/fe')) label = 'frontend';
            else if (branch.startsWith('feat/be')) label = 'backend';
            else if (branch.startsWith('fix/')) label = 'bugfix';
            else if (branch.startsWith('chore/')) label = 'chore';
            if (label) {
              github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: [label]
              });
            }
