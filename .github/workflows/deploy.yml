name: CI/CD Deploy (Manual Fallback)

# TeamCity Cloud가 develop push에 대한 자동 배포를 전담한다 (docs/cicd.md 참조).
# 이 워크플로우는 TeamCity 장애 등 비상 상황에서만 수동으로 실행하는 fallback이므로
# push 트리거를 두지 않는다 — 자동 트리거를 다시 추가하면 TeamCity와 동시에 EC2에
# 배포되어 충돌/중복배포가 발생할 수 있다.
on:
  workflow_dispatch: {}

jobs:
  frontend:
    name: Frontend Build & Push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build
        run: |
          cd frontend
          npm ci --ignore-scripts
          npm run lint
          npm run build

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: jeongyoni/rookie-playbook-frontend:latest

  backend:
    name: Backend Build & Push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle
        run: |
          cd backend
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: jeongyoni/rookie-playbook-backend:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [ frontend, backend ]
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 13.125.15.58
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/rookie-playbook
            docker pull jeongyoni/rookie-playbook-frontend:latest
            docker pull jeongyoni/rookie-playbook-backend:latest
            docker-compose up -d --force-recreate
