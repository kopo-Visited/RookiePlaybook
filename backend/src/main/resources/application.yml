spring:
  application:
    name: backendgit

  datasource:
    url: jdbc:postgresql://${DB_HOST:54.180.104.172}:${DB_PORT:5432}/${DB_NAME:rookie_playbook}
    username: ${DB_USERNAME:rookie}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  sql:
    init:
      mode: always
      encoding: UTF-8

  autoconfigure:
    exclude:
      - org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        options:
          model: llama-3.3-70b-versatile
    google:
      genai:
        api-key: ${GOOGLE_API_KEY}
        embedding:
          options:
            model: text-embedding-004

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.visited.www

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:m/6YS1LTtnccfzCnxC0dalhdktM4fRhWMjyoasW6902JI2OTpkHp5ox0eqpoAeL5}
  expiration: ${JWT_EXPIRATION:86400000}