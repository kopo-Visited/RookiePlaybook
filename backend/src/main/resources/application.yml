spring:
  application:
    name: backendgit

  datasource:
    url: jdbc:postgresql://${DB_HOST:54.180.104.172}:${DB_PORT:5432}/${DB_NAME:rookie_playbook}
    username: ${DB_USERNAME:rookie}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  mybatis:
    mapper-locations: classpath:/mapper/**/*.xml
    type-aliases-package: com.visited.www

  sql:
    init:
      mode: always
      encoding: UTF-8

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:dummy}

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:m/6YS1LTtnccfzCnxC0dalhdktM4fRhWMjyoasW6902JI2OTpkHp5ox0eqpoAeL5}
