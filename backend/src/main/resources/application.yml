spring:
  application:
    name: backendgit

  datasource:
    url: jdbc:postgresql://${DB_HOST:54.180.104.172}:${DB_PORT:5432}/${DB_NAME:rookie_playbook}
    username: ${DB_USERNAME:rookie}
    # 운영 환경은 반드시 DB_PASSWORD 환경변수로 덮어써야 한다 (EC2 .env 참조).
    # 아래 값은 로컬 전용 placeholder이며 절대 운영에 쓰면 안 된다.
    password: ${DB_PASSWORD:CHANGE_ME_INSECURE_LOCAL_ONLY_DB_PASSWORD_PLACEHOLDER}
    driver-class-name: org.postgresql.Driver

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  sql:
    init:
      mode: always
      encoding: UTF-8

  autoconfigure:
    exclude:
      - org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        options:
          model: llama-3.3-70b-versatile
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 768

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.visited.www

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:m/6YS1LTtnccfzCnxC0dalhdktM4fRhWMjyoasW6902JI2OTpkHp5ox0eqpoAeL5}
  expiration: ${JWT_EXPIRATION:86400000}